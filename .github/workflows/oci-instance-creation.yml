name: OCI Always Free Provisioning

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-provisioning-lock
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Select available runner
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_HOSTED_RUNNER_NAME: ${{ vars.SELF_HOSTED_RUNNER_NAME }}
          RUNNER_NAME_FALLBACK: "bunal-ubuntu-24-lts"
        run: |
          runner_name="${SELF_HOSTED_RUNNER_NAME:-$RUNNER_NAME_FALLBACK}"

          if runner=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" 2>/dev/null \
            | jq -r --arg name "$runner_name" \
            '.runners[] | select(.name == $name and .status == "online" and (.busy | not)) | .name') \
            && [ -n "$runner" ]; then
            echo "Selected self-hosted runner: $runner"
            echo "runner=$runner" >> "$GITHUB_OUTPUT"
          else
            echo "Self-hosted runner is unavailable; selected GitHub-hosted runner."
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  create-instance:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    timeout-minutes: 12
    if: vars.INSTANCE_CREATED != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install and configure OCI CLI
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ap-singapore-2
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          python3 -m pip install --user --break-system-packages oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Run OCI provisioning script
        env:
          COMPARTMENT_ID: ${{ secrets.COMPARTMENT_ID }}
          SUBNET_ID: ${{ secrets.SUBNET_ID }}
          IMAGE_ID: ${{ secrets.IMAGE_ID }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          AVAILABILITY_DOMAIN: ${{ vars.AVAILABILITY_DOMAIN }}
          OCPUS: "1"
          MEMORY_GB: "6"
          SLEEP_SECONDS: "30"
          MAX_ATTEMPTS: "8"
          REQUEST_TIMEOUT_SECONDS: "45"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          chmod +x ./launch-oci.sh
          ./launch-oci.sh

      - name: Check if instance was created
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "INSTANCE_CREATED" ]; then
            echo "✅ Instance created successfully!"
            cat INSTANCE_CREATED
            gh variable set INSTANCE_CREATED --body "true" --repo "${{ github.repository }}" 2>/dev/null || echo "ℹ️ Note: Could not auto-update INSTANCE_CREATED variable. Please set repository variable INSTANCE_CREATED=true manually in repo settings."
          else
            echo "⏳ Instance not yet created in this run cycle. Will retry on next scheduled run."
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: oci-logs-${{ github.run_id }}
          path: |
            INSTANCE_CREATED
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup OCI credentials
        if: always()
        run: rm -f ~/.oci/oci_api_key.pem ~/.oci/config
