name: OCI Free Tier Instance Creation

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-instance-creation
  cancel-in-progress: false

jobs:
  create-instance:
    runs-on: self-hosted
    timeout-minutes: 20
    if: vars.INSTANCE_CREATED != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup OCI config files
        run: |
          echo "${{ secrets.OCI_CONFIG_CONTENT }}" > oci_config
          echo "${{ secrets.OCI_API_PRIVATE_KEY }}" > oci_api_private_key.pem
          chmod 600 oci_api_private_key.pem
          echo "${{ secrets.OCI_ENV_CONTENT }}" > oci.env
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > id_rsa.pub

      - name: Run instance creation
        timeout-minutes: 14
        env:
          MAX_RUNTIME_SECS: ${{ vars.MAX_RUNTIME_SECS || '780' }}
        run: python main.py

      - name: Check if instance was created
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "INSTANCE_CREATED" ]; then
            echo "✅ Instance created successfully!"
            cat INSTANCE_CREATED
            gh variable set INSTANCE_CREATED --body "true" --repo "${{ github.repository }}" 2>/dev/null || echo "ℹ️ Note: Could not auto-update INSTANCE_CREATED variable. Please set repository variable INSTANCE_CREATED=true manually in repo settings."
          else
            echo "⏳ Instance not yet created in this run cycle. Will retry on next scheduled run."
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-logs-${{ github.run_id }}
          path: |
            *.log
            INSTANCE_CREATED
            UNHANDLED_ERROR.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup sensitive files
        if: always()
        run: rm -f oci_config oci_api_private_key.pem oci.env id_rsa.pub
